<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Session — WaveLink</title>
<meta name="description" content="Manage a live WaveLink session." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app-shell.css">

<style>
.session-hero{
  border-radius: var(--radius-lg); border: 1px solid var(--border);
  background:
    radial-gradient(circle at 20% 0%, rgba(63,214,255,0.16), transparent 55%),
    linear-gradient(180deg, rgba(18,24,38,0.75), rgba(9,12,20,0.75));
  backdrop-filter: blur(14px);
  padding: 26px 28px; margin-bottom: 24px;
}
.session-hero h1{ font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0 0 6px; }
.session-hero .meta{ font-size: 13.5px; color: var(--text-dim); }

.phase-track{ display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; }
.phase-pill{
  font-family: var(--font-mono); font-size: 11px; padding: 5px 11px; border-radius: 100px;
  border: 1px solid var(--border-soft); color: var(--text-faint); background: rgba(255,255,255,0.02);
}
.phase-pill.current{ color: var(--accent-soft); border-color: rgba(63,214,255,0.28); background: rgba(63,214,255,0.1); }
.phase-pill.done{ color: var(--success); border-color: rgba(52,224,161,0.24); }

.session-actions{ display: flex; gap: 10px; flex-wrap: wrap; }

.participant-row{
  display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 10px;
  transition: background 0.2s var(--ease);
}
.participant-row:hover{ background: rgba(255,255,255,0.03); }
.participant-row .name{ font-size: 13.5px; font-weight: 600; color: var(--text); }
.participant-row .role-tag{
  font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em;
  color: var(--text-faint); background: rgba(255,255,255,0.04); border: 1px solid var(--border-soft);
  padding: 2px 7px; border-radius: 100px; margin-left: 8px;
}
.participant-row .spacer{ flex: 1; }

/* ---- Bloxlink-style phase grid ---- */
.grid-row{
  display: flex; align-items: center; gap: 12px;
  padding: 8px 6px; border-radius: 8px;
  transition: background 0.2s var(--ease);
  border-bottom: 1px solid var(--border-soft);
}
.grid-row:last-child{ border-bottom: none; }
.grid-row:hover{ background: rgba(255,255,255,0.02); }
.grid-row-head{
  font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint);
  text-transform: uppercase; letter-spacing: 0.03em; padding-bottom: 10px;
}
.grid-user{ display: flex; align-items: center; gap: 8px; width: 160px; flex-shrink: 0; }
.grid-avatar{ width: 28px; height: 28px; border-radius: 7px; object-fit: cover; flex-shrink: 0; }
.grid-user .name{ font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }
.grid-phases{ display: flex; gap: 6px; flex-shrink: 0; }
.grid-phase-head{ width: 20px; text-align: center; display: inline-block; }
.grid-check{
  width: 18px; height: 18px; accent-color: var(--accent);
  cursor: pointer; flex-shrink: 0;
}
.grid-check:disabled{ cursor: default; opacity: 0.6; }
.grid-divider{ width: 1px; align-self: stretch; background: var(--border-soft); flex-shrink: 0; }
.grid-cell{ display: flex; align-items: center; gap: 5px; flex-shrink: 0; min-width: 70px; }
.pass-check{ display:flex; align-items:center; gap:6px; font-size: 12.5px; color: var(--text-dim); }
</style>
</head>
<body>

<div class="bg-layer" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-glow-primary"></div>
  <div class="bg-glow-secondary"></div>
  <div id="particles"></div>
</div>

<div class="sidebar-scrim" id="sidebarScrim"></div>

<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar">
    <a href="index.html" class="sidebar-brand">WaveLink</a>

    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="3" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="14" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="14" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/></svg>
        Overview
      </a>
      <a href="communities.html" class="sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.7"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        Communities
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div class="avatar" id="sidebarAvatar"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/></svg></div>
        <div class="sidebar-user-info">
          <div class="name" id="sidebarUsername">—</div>
          <div class="sub">● Roblox connected</div>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Log out
      </button>
    </div>
  </aside>

  <main class="app-main">
    <div class="mobile-topbar">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="brand" style="font-size:16px;">WaveLink</span>
    </div>

    <div id="sessionContainer">
      <div class="loading-state">
        <div class="spinner" aria-hidden="true"></div>
        Loading session…
      </div>
    </div>
  </main>
</div>

<script src="main.js" defer></script>
<script src="app-shell.js" defer></script>
<script src="session.js" defer></script>
</body>
</html>
