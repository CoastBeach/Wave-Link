<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Community — WaveLink</title>
<meta name="description" content="Your WaveLink community." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app-shell.css">

<style>
/* ---- Big community display header ---- */
.community-hero{
  position: relative;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  background:
    radial-gradient(circle at 20% 0%, rgba(63,214,255,0.16), transparent 55%),
    radial-gradient(circle at 90% 100%, rgba(91,127,255,0.14), transparent 55%),
    linear-gradient(180deg, rgba(18,24,38,0.75), rgba(9,12,20,0.75));
  backdrop-filter: blur(14px);
  padding: 30px 32px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 22px;
  flex-wrap: wrap;
}

.community-hero-icon{
  width: 84px; height: 84px;
  border-radius: 18px;
  object-fit: cover;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border-soft);
  flex-shrink: 0;
}
.community-hero-icon.placeholder{ display: grid; place-items: center; color: var(--text-faint); }
.community-hero-icon.placeholder svg{ width: 34px; height: 34px; }

.community-hero-info{ flex: 1; min-width: 200px; }
.community-hero-info h1{
  font-family: var(--font-display); font-size: 24px; font-weight: 700;
  letter-spacing: -0.01em; margin: 0 0 6px;
}
.community-hero-meta{
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 13.5px; color: var(--text-dim);
}
.community-hero-meta .dot{ width: 3px; height: 3px; border-radius: 50%; background: var(--text-faint); }

.role-badge{
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  padding: 3px 10px; border-radius: 100px;
  background: rgba(63,214,255,0.1); color: var(--accent-soft);
  border: 1px solid rgba(63,214,255,0.22);
}
.role-badge.owner{ background: rgba(255,180,84,0.1); color: var(--warn); border-color: rgba(255,180,84,0.22); }

.primary-btn{
  flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.03);
  color: var(--text-dim);
  font-family: var(--font-body); font-weight: 600; font-size: 13.5px;
  cursor: pointer;
  transition: border-color 0.2s var(--ease), color 0.2s var(--ease), background 0.2s var(--ease);
}
.primary-btn svg{ width: 15px; height: 15px; }
.primary-btn:hover{ border-color: rgba(255,180,84,0.3); color: var(--warn); }
.primary-btn.is-primary{
  background: rgba(255,180,84,0.1); border-color: rgba(255,180,84,0.28); color: var(--warn);
}

/* ---- Tab navigation ---- */
.community-tabs{
  display: flex; gap: 4px; margin-bottom: 24px; flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0;
}
.community-tab{
  padding: 10px 16px; font-size: 13.5px; font-weight: 500; color: var(--text-dim);
  border-bottom: 2px solid transparent; cursor: pointer; background: none; border-top: none; border-left: none; border-right: none;
  font-family: var(--font-body);
  transition: color 0.2s var(--ease), border-color 0.2s var(--ease);
}
.community-tab:hover{ color: var(--text); }
.community-tab.active{ color: var(--accent-soft); border-bottom-color: var(--accent-soft); }

.tab-panel{ display: none; }
.tab-panel.active{ display: block; }

.welcome-card{
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg);
  backdrop-filter: blur(14px); padding: 32px; text-align: center;
}
.welcome-card .avatar-lg{
  width: 72px; height: 72px; border-radius: 16px; margin: 0 auto 18px; overflow: hidden;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border-soft);
}
.welcome-card .avatar-lg img{ width: 100%; height: 100%; object-fit: cover; }
.welcome-card h2{ font-family: var(--font-display); font-size: 20px; font-weight: 700; margin: 0 0 8px; }
.welcome-card p{ font-size: 14px; color: var(--text-dim); margin: 0; }

.empty-tab{
  text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 14px;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); backdrop-filter: blur(14px);
}
.empty-tab .tag{
  display: inline-block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--text-faint); background: rgba(255,255,255,0.03); border: 1px solid var(--border-soft);
  padding: 3px 9px; border-radius: 100px; margin-bottom: 14px;
}

.loading-state, .error-state{ text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 14px; }
.error-state{ color: #ff8a8a; }
.loading-state .spinner{
  width: 22px; height: 22px; margin: 0 auto 16px;
  border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); border-top-color: var(--accent);
  animation: spin 0.7s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="bg-layer" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-glow-primary"></div>
  <div class="bg-glow-secondary"></div>
  <div id="particles"></div>
</div>

<div class="sidebar-scrim" id="sidebarScrim"></div>

<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar">
    <a href="index.html" class="sidebar-brand">WaveLink</a>

    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="3" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="14" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="14" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/></svg>
        Overview
      </a>
      <a href="communities.html" class="sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.7"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        Communities
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div class="avatar" id="sidebarAvatar"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/></svg></div>
        <div class="sidebar-user-info">
          <div class="name" id="sidebarUsername">—</div>
          <div class="sub">● Roblox connected</div>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Log out
      </button>
    </div>
  </aside>

  <main class="app-main">
    <div class="mobile-topbar">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="brand" style="font-size:16px;">WaveLink</span>
    </div>

    <div id="communityContainer">
      <div class="loading-state">
        <div class="spinner" aria-hidden="true"></div>
        Loading community…
      </div>
    </div>
  </main>
</div>

<script src="main.js" defer></script>
<script src="app-shell.js" defer></script>
<script src="community.js" defer></script>
</body>
</html>
